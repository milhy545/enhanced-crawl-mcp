name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting
      run: |
        pip install ruff black isort mypy
        ruff check app/
        black --check app/
        isort --check app/
        mypy app/ --ignore-missing-imports

    - name: Run tests
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run security scan with Bandit
      run: |
        bandit -r app/ -f json -o bandit-report.json || true
        bandit -r app/

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json || true
        safety check

            - název: Souhrn problémů
  # Můžete se připnout k přesnému commitu nebo k verzi.
  # použití: sourcegraph/summary-issues@9a33468abb4f7415f4dad4424f7ad8aee136fbe9
  použití: sourcegraph/summary-issues@v1.2.1
  s:
    # V souhrnu se použije nejnovější komentář k problému, který odpovídá tomuto regulárnímu výrazu. Pokud není uveden, vždy se použije nejnovější komentář.
    summaryCommentRegex: # volitelné
              - název: Přidat do projektů GitHubu
  použití: actions/add-to-project@v1.0.2
  s:
    # URL adresa projektu, do kterého se mají přidat úlohy
    URL projektu:
    # Osobní přístupový token GitHubu s oprávněním pro zápis do projektu
    token githubu:
    # Seznam štítků oddělených čárkami, které se mají použít jako filtr pro přidání problému
    označeno: # volitelné
    # Chování filtru popisků: A pro shodu se všemi popisky, NEBO pro shodu s libovolným popiskem, NE pro vyloučení žádného uvedeného popisku (výchozí je NEBO)
    operátor-label: # volitelný
